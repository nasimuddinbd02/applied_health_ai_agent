# Workload identity: the pods get an Entra ID identity federated to this
# service account, so nothing in the cluster holds a stored credential. Fill in
# the client id of the user-assigned managed identity created by the Bicep
# template (deploy/azure/main.bicep outputs it).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cityhospital
  annotations:
    azure.workload.identity/client-id: "MANAGED_IDENTITY_CLIENT_ID"
