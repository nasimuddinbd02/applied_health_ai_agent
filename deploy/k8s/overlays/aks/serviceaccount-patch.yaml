# Attach the workload-identity service account to every backend workload.
# The `azure.workload.identity/use` label on the POD TEMPLATE is what makes the
# webhook inject the projected token — putting it only on the ServiceAccount
# is the usual mistake.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
spec:
  template:
    metadata:
      labels:
        azure.workload.identity/use: "true"
    spec:
      serviceAccountName: cityhospital
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-worker
spec:
  template:
    metadata:
      labels:
        azure.workload.identity/use: "true"
    spec:
      serviceAccountName: cityhospital
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp
spec:
  template:
    metadata:
      labels:
        azure.workload.identity/use: "true"
    spec:
      serviceAccountName: cityhospital
---
apiVersion: batch/v1
kind: Job
metadata:
  name: db-schema
spec:
  template:
    metadata:
      labels:
        azure.workload.identity/use: "true"
    spec:
      serviceAccountName: cityhospital
