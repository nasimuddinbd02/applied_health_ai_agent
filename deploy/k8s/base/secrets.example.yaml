# Template only — DO NOT COMMIT REAL VALUES.
#
# Create the real Secret out of band, e.g.
#
#   kubectl -n cityhospital create secret generic backend-secrets \
#     --from-literal=DATABASE_URL='postgresql+psycopg://user:pass@host:5432/cityhospital?sslmode=require' \
#     --from-literal=REDIS_URL='rediss://:<access-key>@<name>.redis.cache.windows.net:6380/0' \
#     --from-literal=JWT_SECRET="$(openssl rand -hex 32)" \
#     --from-literal=OPENAI_API_KEY='sk-...'
#
# In Azure, prefer the AKS Secret Store CSI driver with Key Vault over a
# long-lived Kubernetes Secret; see docs/deployment.md.
apiVersion: v1
kind: Secret
metadata:
  name: backend-secrets
type: Opaque
stringData:
  DATABASE_URL: "postgresql+psycopg://cityhospital:CHANGE_ME@postgres:5432/cityhospital"
  REDIS_URL: "redis://redis:6379/0"
  # JWT_SECRET signs both staff logins and anonymous guest chat sessions.
  # Rotating it logs everyone out and invalidates in-flight guest sessions.
  JWT_SECRET: "CHANGE_ME"
  # Blank is valid: the agent then reports a failure instead of answering.
  OPENAI_API_KEY: ""
  ANTHROPIC_API_KEY: ""
  GEMINI_API_KEY: ""
