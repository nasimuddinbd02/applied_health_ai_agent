# The FastMCP tool server. The agent loads its tools from here over SSE.
#
# Kept as its own Deployment so the tool surface can be scaled, restarted and
# secured independently of the agent that calls it — and so it is reachable by
# cluster DNS only, never from the ingress.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp
  labels:
    app.kubernetes.io/name: cityhospital
    app.kubernetes.io/component: mcp
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: mcp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cityhospital
        app.kubernetes.io/component: mcp
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
      containers:
        - name: mcp
          image: cityhospital-backend:latest
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "app.mcp.server"]
          ports:
            - name: http
              containerPort: 8077
          env:
            # Bind all interfaces inside the pod; the ConfigMap's MCP_HOST is
            # the *client* side value (the Service name) and would be wrong here.
            - name: MCP_HOST
              value: "0.0.0.0"
          envFrom:
            - configMapRef:
                name: backend-config
            - secretRef:
                name: backend-secrets
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: mcp
  labels:
    app.kubernetes.io/name: cityhospital
    app.kubernetes.io/component: mcp
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/component: mcp
  ports:
    - name: http
      port: 8077
      targetPort: http
