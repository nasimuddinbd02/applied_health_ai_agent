# Keep at least one of each user-facing workload during voluntary disruption
# (node drains, cluster upgrades). Without these, a drain can take every
# gateway pod at once and every customer loses their socket simultaneously.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: gateway
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: gateway
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: web
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: web
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: agent-worker
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: agent-worker
