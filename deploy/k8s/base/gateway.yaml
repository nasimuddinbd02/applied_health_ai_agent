# The chat gateway: FastAPI + the /ws/chat WebSocket endpoint.
#
# This is the only workload that holds customer sockets, which drives most of
# what is unusual below: a long termination grace period, a preStop pause, a
# liveness probe with no dependencies, and SERVER_ID taken from the pod name.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  labels:
    app.kubernetes.io/name: cityhospital
    app.kubernetes.io/component: gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/component: gateway
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0   # never drop below the current socket capacity
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cityhospital
        app.kubernetes.io/component: gateway
    spec:
      # Long enough for preStop (15s) plus ConnectionManager.drain() to close
      # every socket with 1001 Going Away, so clients reconnect deliberately
      # instead of seeing a broken pipe.
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
      containers:
        - name: gateway
          image: cityhospital-backend:latest
          imagePullPolicy: IfNotPresent
          command:
            - uvicorn
            - app.main:app
            - --host
            - 0.0.0.0
            - --port
            - "8000"
          ports:
            - name: http
              containerPort: 8000
          env:
            # Redis maps conversation -> owning instance using this id, so it
            # has to be the pod's real identity, not a static string.
            - name: SERVER_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            # Agent work runs on the worker Deployment, not here: a slow model
            # call must never occupy a process that is holding sockets.
            - name: INLINE_AGENT_WORKER
              value: "false"
          envFrom:
            - configMapRef:
                name: backend-config
            - secretRef:
                name: backend-secrets
          # Deliberately /health/live, which touches nothing: a Redis outage
          # must not get pods killed while they are serving connections.
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 5
            failureThreshold: 30   # up to 150s for a cold start
          lifecycle:
            preStop:
              exec:
                # Pause so the ingress and kube-proxy stop sending NEW
                # connections here before the app starts closing existing ones.
                # Without it, a client can be routed to a pod that is already
                # shutting down.
                command: ["sh", "-c", "sleep 15"]
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 768Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        # readOnlyRootFilesystem is on, so anything that writes needs an
        # explicit mount. This is the only one the gateway needs.
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  labels:
    app.kubernetes.io/name: cityhospital
    app.kubernetes.io/component: gateway
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/component: gateway
  ports:
    - name: http
      port: 8000
      targetPort: http
